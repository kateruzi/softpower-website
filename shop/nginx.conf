# Статика сайта плюс сервис магазина под /api на том же домене:
# витрине не нужен cors, а браузеру — второй адрес.

server {
    listen 80;
    server_name _;

    root /site;
    index index.html;

    # За caddy nginx видит только http: абсолютный Location вёл бы на http://
    # и стоил лишнего редиректа. Относительный браузер достроит сам по https.
    absolute_redirect off;

    # Ничего, кроме самого сайта, наружу не отдаём: исходники сервиса,
    # история git и конфигурация в webroot лежат, но недоступны.
    location ~ ^/(shop|\.git|\.github|brand_core|design|old_website)(/|$) { return 404; }
    location ~ /\. { return 404; }
    # Заметки для своих (design.md, README.md) — не часть сайта.
    location ~ \.md$ { return 404; }

    location /api/ {
        proxy_pass http://shop:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Soft Power Connection с 25.09.2026 не продаётся: практики переехали в
    # бесплатное приложение, страница подписки лежит в old_website/. Старые
    # ссылки на неё (instagram, бот, посты) ведут к блоку приложения на /praktika.
    location ~ ^/connection(\.html)?$    { return 302 /praktika#app; }
    location ~ ^/connection-en(\.html)?$ { return 302 /praktika-en#app; }

    # Адреса без .html — так свёрстаны все ссылки на сайте.
    location / { try_files $uri $uri.html $uri/ =404; }
}
